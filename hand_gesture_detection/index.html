<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand & Gesture Recognition AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0e1117;
      --card-bg: rgba(18, 22, 34, 0.85);
      --cyan: #00e5ff;
      --emerald: #00e676;
      --coral: #ff5252;
      --gold: #ffd600;
      --text: #f0f4f8;
      --border: rgba(0, 229, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      background: rgba(14, 17, 23, 0.95);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-family: 'Orbitron', monospace;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
    }

    .brand .badge {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .metric {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .metric span {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
    }

    .metric.fps span { color: var(--emerald); }
    .metric.hands span { color: var(--cyan); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 8px 32px rgba(0, 229, 255, 0.1);
    }

    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Default mirrored */
    }

    video.no-mirror {
      transform: scaleX(1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;
    }

    .overlay-loading {
      position: absolute;
      inset: 0;
      background: rgba(14, 17, 23, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 5;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--cyan);
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 229, 255, 0.2);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .controls-toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 960px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(0, 229, 255, 0.15);
      border-color: var(--cyan);
      color: #fff;
    }

    .btn.active {
      background: rgba(0, 229, 255, 0.25);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .cards-dock {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      width: 100%;
      max-width: 960px;
    }

    .hand-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .hand-card.front-palm {
      border-color: var(--emerald);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .orientation-pill {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .orientation-pill.front {
      background: rgba(0, 230, 118, 0.15);
      color: var(--emerald);
      border: 1px solid var(--emerald);
    }

    .orientation-pill.back {
      background: rgba(0, 229, 255, 0.15);
      color: var(--cyan);
      border: 1px solid var(--cyan);
    }

    .gesture-display {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--emerald);
      transition: width 0.15s ease;
    }

    .fingers-strip {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 4px;
    }

    .finger-box {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid var(--coral);
      color: var(--coral);
    }

    .finger-box.up {
      background: rgba(0, 230, 118, 0.15);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>HAND & GESTURE RECOGNITION</h1>
      <span class="badge">AI Web Vision</span>
    </div>
    <div class="status-bar">
      <div class="metric fps">FPS: <span id="fpsDisplay">0.0</span></div>
      <div class="metric hands">HANDS: <span id="handsCountDisplay">0</span></div>
    </div>
  </header>

  <main>
    <div class="viewport-container">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="outputCanvas"></canvas>
      <div class="overlay-loading" id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingStatus">Initializing MediaPipe Vision Model...</p>
      </div>
    </div>

    <div class="controls-toolbar">
      <button class="btn active" id="toggleSkeleton">🦴 Skeleton: ON</button>
      <button class="btn active" id="toggleBoxes">📦 Boxes: ON</button>
      <button class="btn active" id="toggleMirror">🪞 Mirror: ON</button>
      <button class="btn" id="toggleCamera">🔄 Flip Camera</button>
      <button class="btn" id="toggleContrast">✨ Contrast Boost</button>
    </div>

    <div class="cards-dock" id="cardsDock">
      <!-- Hand status cards will appear here dynamically -->
    </div>
  </main>

  <footer>
    Powered by <strong>Google MediaPipe</strong> • Hosted on <strong>GitHub Pages</strong>
  </footer>

  <!-- MediaPipe Tasks Vision Bundle via CDN -->
  <script type="module">
    import {
      GestureRecognizer,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("outputCanvas");
    const ctx = canvas.getContext("2d");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const loadingStatus = document.getElementById("loadingStatus");
    const fpsDisplay = document.getElementById("fpsDisplay");
    const handsCountDisplay = document.getElementById("handsCountDisplay");
    const cardsDock = document.getElementById("cardsDock");

    const toggleSkeletonBtn = document.getElementById("toggleSkeleton");
    const toggleBoxesBtn = document.getElementById("toggleBoxes");
    const toggleMirrorBtn = document.getElementById("toggleMirror");
    const toggleCameraBtn = document.getElementById("toggleCamera");
    const toggleContrastBtn = document.getElementById("toggleContrast");

    let gestureRecognizer = null;
    let isVideoPlaying = false;
    let showSkeleton = true;
    let showBoxes = true;
    let isMirrored = true;
    let contrastBoost = false;
    let currentFacingMode = "user";
    let lastVideoTime = -1;
    let lastFrameTime = performance.now();
    let fps = 0.0;

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    const GESTURE_EMOJIS = {
      "Closed_Fist": "✊",
      "Open_Palm": "✋",
      "Pointing_Up": "☝️",
      "Thumb_Up": "👍",
      "Thumb_Down": "👎",
      "Victory": "✌️",
      "ILoveYou": "🤟",
      "OK": "👌",
      "Rock": "🤘",
      "Call_Me": "🤙",
      "Gun": "👉",
      "Pinch": "🤏"
    };

    async function initMediaPipe() {
      try {
        loadingStatus.textContent = "Loading WebAssembly vision runtime...";
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        loadingStatus.textContent = "Loading AI Gesture Recognizer model...";
        gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.3,
          minHandPresenceConfidence: 0.3,
          minTrackingConfidence: 0.3
        });

        loadingStatus.textContent = "Requesting Webcam access...";
        await startCamera();
        loadingOverlay.style.display = "none";
      } catch (err) {
        console.error("Initialization error:", err);
        loadingStatus.innerHTML = `<span style="color: var(--coral);">Error: ${err.message}</span><br>Please allow camera permissions and reload.`;
      }
    }

    async function startCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      return new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          isVideoPlaying = true;
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          requestAnimationFrame(renderLoop);
          resolve();
        };
      });
    }

    function dist3d(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y, p1.z - p2.z);
    }

    function analyzeFingersAndOrientation(landmarks, worldLandmarks, rawHandedness = "Right") {
      const lms = worldLandmarks || landmarks;
      const wrist = lms[0];
      const pIdx = lms[5];
      const pMid = lms[9];
      const pPky = lms[17];

      // Palm normal 2D cross-product
      const vHoriz = { x: pPky.x - pIdx.x, y: pPky.y - pIdx.y };
      const vVert = { x: pMid.x - wrist.x, y: pMid.y - wrist.y };
      const cz = (vHoriz.x * vVert.y) - (vHoriz.y * vVert.x);
      const scale = Math.hypot(vHoriz.x, vHoriz.y) * Math.hypot(vVert.x, vVert.y) + 1e-7;
      const nCz = cz / scale;

      // In camera frame:
      // Right Hand: nCz < -0.12 -> Palm (Front), nCz > 0.12 -> Back
      // Left Hand: nCz > 0.12 -> Palm (Front), nCz < -0.12 -> Back
      const isFrontPalm = (rawHandedness === "Right") ? (nCz < -0.12) : (nCz > 0.12);

      const fingersUp = [false, false, false, false, false];
      const chains = [
        [8, 6, 5],   // Index: tip, pip, mcp
        [12, 10, 9], // Middle
        [16, 14, 13],// Ring
        [20, 18, 17] // Pinky
      ];

      chains.forEach(([tipIdx, pipIdx, mcpIdx], i) => {
        const tip = lms[tipIdx];
        const pip = lms[pipIdx];
        const mcp = lms[mcpIdx];
        const dTipWrist = dist3d(tip, wrist);
        const dPipWrist = dist3d(pip, wrist);
        const dTipMcp = dist3d(tip, mcp);
        const dPipMcp = dist3d(pip, mcp);

        fingersUp[i + 1] = (dTipWrist > dPipWrist * 1.08 && dTipMcp > dPipMcp);
      });

      // Thumb
      const tTip = lms[4];
      const tIp = lms[3];
      const dThumbPinky = dist3d(tTip, pPky);
      const dIpPinky = dist3d(tIp, pPky);
      const dThumbWrist = dist3d(tTip, wrist);
      const dMcpWrist = dist3d(lms[2], wrist);

      if (dThumbPinky <= dIpPinky * 1.05) {
        fingersUp[0] = false;
      } else {
        fingersUp[0] = (dThumbPinky > dIpPinky * 1.12 && dThumbWrist > dMcpWrist * 1.15);
      }

      return { fingersUp, isFrontPalm, fingerCount: fingersUp.filter(Boolean).length };
    }

    function renderLoop(timestamp) {
      if (!isVideoPlaying) return;

      const now = performance.now();
      const dt = (now - lastFrameTime) / 1000;
      lastFrameTime = now;
      if (dt > 0) {
        fps = 0.9 * fps + 0.1 * (1 / dt);
        fpsDisplay.textContent = fps.toFixed(1);
      }

      if (canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gestureRecognizer && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = gestureRecognizer.recognizeForVideo(video, timestamp);

        const handsData = [];
        const numHands = results.landmarks ? results.landmarks.length : 0;
        handsCountDisplay.textContent = numHands;

        if (numHands > 0) {
          for (let i = 0; i < numHands; i++) {
            const lms = results.landmarks[i];
            const worldLms = results.worldLandmarks ? results.worldLandmarks[i] : null;
            const rawHandedness = handednessCat ? (handednessCat.categoryName || "Right") : "Right";
            let handedness = handednessCat ? handednessCat.displayName || handednessCat.categoryName : "Right";
            if (isMirrored) {
              handedness = (handedness === "Left") ? "Right" : "Left";
            }

            const { fingersUp, isFrontPalm, fingerCount } = analyzeFingersAndOrientation(lms, worldLms, rawHandedness);

            let modelGesture = "None";
            let modelScore = 0.0;
            if (results.gestures && results.gestures[i] && results.gestures[i].length > 0) {
              modelGesture = results.gestures[i][0].categoryName;
              modelScore = results.gestures[i][0].score;
            }

            // Synthesize primary gesture
            let gesture = modelGesture;
            let score = modelScore;

            if (fingerCount === 5) { gesture = "Open_Palm"; score = 0.95; }
            else if (fingerCount === 0) { gesture = "Closed_Fist"; score = 0.92; }
            else if (fingersUp[1] && fingersUp[2] && !fingersUp[3] && !fingersUp[4]) { gesture = "Victory"; score = 0.92; }
            else if (fingersUp[1] && !fingersUp[2] && !fingersUp[3] && !fingersUp[4]) { gesture = "Pointing_Up"; score = 0.90; }
            else if (fingersUp[0] && !fingersUp[1] && !fingersUp[2] && !fingersUp[3] && !fingersUp[4]) { gesture = "Thumb_Up"; score = 0.88; }
            else if (modelGesture === "None") { gesture = `${fingerCount} Fingers`; score = 0.75; }

            handsData.push({
              handedness,
              isFrontPalm,
              gesture,
              score,
              fingersUp,
              fingerCount,
              landmarks: lms
            });

            // Draw Visual Overlays
            drawHandOverlay(lms, isFrontPalm, handedness, gesture, score, fingersUp);
          }
        }

        updateHUDCards(handsData);
      }

      requestAnimationFrame(renderLoop);
    }

    function drawHandOverlay(lms, isFrontPalm, handedness, gesture, score, fingersUp) {
      const w = canvas.width;
      const h = canvas.height;
      const themeColor = isFrontPalm ? "#00e676" : "#00e5ff";

      // Skeleton connections
      if (showSkeleton) {
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 3;
        HAND_CONNECTIONS.forEach(([i1, i2]) => {
          const p1 = lms[i1];
          const p2 = lms[i2];
          const x1 = isMirrored ? (1 - p1.x) * w : p1.x * w;
          const y1 = p1.y * h;
          const x2 = isMirrored ? (1 - p2.x) * w : p2.x * w;
          const y2 = p2.y * h;

          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        });

        // Joints
        lms.forEach((p, idx) => {
          const x = isMirrored ? (1 - p.x) * w : p.x * w;
          const y = p.y * h;
          ctx.beginPath();
          ctx.arc(x, y, 4, 0, 2 * Math.PI);
          ctx.fillStyle = "#ffd600";
          ctx.fill();
        });

        // Fingertip Highlights
        const tipIndices = [4, 8, 12, 16, 20];
        tipIndices.forEach((tipIdx, fIdx) => {
          const p = lms[tipIdx];
          const x = isMirrored ? (1 - p.x) * w : p.x * w;
          const y = p.y * h;
          const isUp = fingersUp[fIdx];

          ctx.beginPath();
          ctx.arc(x, y, 7, 0, 2 * Math.PI);
          ctx.strokeStyle = isUp ? "#00e676" : "#ff5252";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = "#ffffff";
          ctx.fill();
        });
      }

      // Bounding Box
      if (showBoxes) {
        let minX = 1, minY = 1, maxX = 0, maxY = 0;
        lms.forEach(p => {
          const x = isMirrored ? (1 - p.x) : p.x;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });

        const pad = 24;
        const bx1 = Math.max(10, minX * w - pad);
        const by1 = Math.max(10, minY * h - pad);
        const bx2 = Math.min(w - 10, maxX * w + pad);
        const by2 = Math.min(h - 10, maxY * h + pad);

        // Tech Corner Brackets
        const cLen = 18;
        ctx.strokeStyle = themeColor;
        ctx.lineWidth = 2.5;

        // Top-left
        ctx.beginPath();
        ctx.moveTo(bx1, by1 + cLen); ctx.lineTo(bx1, by1); ctx.lineTo(bx1 + cLen, by1);
        ctx.stroke();
        // Top-right
        ctx.beginPath();
        ctx.moveTo(bx2 - cLen, by1); ctx.lineTo(bx2, by1); ctx.lineTo(bx2, by1 + cLen);
        ctx.stroke();
        // Bottom-left
        ctx.beginPath();
        ctx.moveTo(bx1, by2 - cLen); ctx.lineTo(bx1, by2); ctx.lineTo(bx1 + cLen, by2);
        ctx.stroke();
        // Bottom-right
        ctx.beginPath();
        ctx.moveTo(bx2 - cLen, by2); ctx.lineTo(bx2, by2); ctx.lineTo(bx2, by2 - cLen);
        ctx.stroke();

        // Floating Badge
        const orientText = isFrontPalm ? "PALM" : "BACK";
        const cleanGesture = gesture.replace("_", " ");
        const badgeText = `${handedness} [${orientText}] | ${cleanGesture} (${Math.round(score * 100)}%)`;

        ctx.font = "bold 13px Rajdhani, sans-serif";
        const textWidth = ctx.measureText(badgeText).width;
        const pillY = by1 < 50 ? by2 + 6 : by1 - 26;

        ctx.fillStyle = "rgba(18, 22, 34, 0.85)";
        ctx.fillRect(bx1, pillY, textWidth + 14, 22);
        ctx.strokeStyle = themeColor;
        ctx.strokeRect(bx1, pillY, textWidth + 14, 22);

        ctx.fillStyle = "#ffffff";
        ctx.fillText(badgeText, bx1 + 7, pillY + 16);
      }
    }

    function updateHUDCards(hands) {
      if (hands.length === 0) {
        cardsDock.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 24px; color: rgba(255,255,255,0.4); font-size: 1.1rem;">
            🖐️ Hold your hand in front of the camera to begin detection
          </div>
        `;
        return;
      }

      cardsDock.innerHTML = hands.map(h => {
        const emoji = GESTURE_EMOJIS[h.gesture] || "🖐️";
        const orientClass = h.isFrontPalm ? "front" : "back";
        const orientText = h.isFrontPalm ? "FRONT (PALM)" : "BACK OF HAND";
        const labels = ["T", "I", "M", "R", "P"];

        return `
          <div class="hand-card ${h.isFrontPalm ? 'front-palm' : ''}">
            <div class="card-header">
              <span>${h.handedness.toUpperCase()} HAND</span>
              <span class="orientation-pill ${orientClass}">${orientText}</span>
            </div>
            <div class="gesture-display">
              <span>${emoji}</span>
              <span>${h.gesture.replace("_", " ")}</span>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width: ${Math.round(h.score * 100)}%;"></div>
            </div>
            <div style="font-size: 0.95rem; font-weight: 600; color: #ffd600;">
              Fingers Extended: ${h.fingerCount} / 5
            </div>
            <div class="fingers-strip">
              ${h.fingersUp.map((up, i) => `
                <div class="finger-box ${up ? 'up' : ''}">
                  ${labels[i]}:${up ? '1' : '0'}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // Event Listeners
    toggleSkeletonBtn.addEventListener("click", () => {
      showSkeleton = !showSkeleton;
      toggleSkeletonBtn.classList.toggle("active", showSkeleton);
      toggleSkeletonBtn.textContent = `🦴 Skeleton: ${showSkeleton ? 'ON' : 'OFF'}`;
    });

    toggleBoxesBtn.addEventListener("click", () => {
      showBoxes = !showBoxes;
      toggleBoxesBtn.classList.toggle("active", showBoxes);
      toggleBoxesBtn.textContent = `📦 Boxes: ${showBoxes ? 'ON' : 'OFF'}`;
    });

    toggleMirrorBtn.addEventListener("click", () => {
      isMirrored = !isMirrored;
      video.classList.toggle("no-mirror", !isMirrored);
      toggleMirrorBtn.classList.toggle("active", isMirrored);
      toggleMirrorBtn.textContent = `🪞 Mirror: ${isMirrored ? 'ON' : 'OFF'}`;
    });

    toggleCameraBtn.addEventListener("click", async () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      await startCamera();
    });

    toggleContrastBtn.addEventListener("click", () => {
      contrastBoost = !contrastBoost;
      toggleContrastBtn.classList.toggle("active", contrastBoost);
      video.style.filter = contrastBoost ? "contrast(135%) brightness(105%)" : "none";
    });

    // Start
    initMediaPipe();
  </script>
</body>
</html>
